[package]
name = "adbfs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.59", features = ["derive"] }
color-eyre = "0.6.5"
dashmap = "6.1.0"
fuser = "0.17.0"
libc = "0.2.182"
tempfile = "3.25.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "process", "macros", "fs", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.10.0"
